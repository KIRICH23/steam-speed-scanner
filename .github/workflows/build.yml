name: Build EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE
      run: |
        pyinstaller --onefile --name "SteamSpeedScanner" steam_speed_scanner.py
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamSpeedScanner
        path: dist/SteamSpeedScanner.exe
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes dist/SteamSpeedScanner.exe || `
        gh release upload ${{ github.ref_name }} dist/SteamSpeedScanner.exe --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
