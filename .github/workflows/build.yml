name: Build EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE
      run: |
        pyinstaller --onefile --name "SteamSpeedScanner" steam_speed_scanner.py
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamSpeedScanner
        path: dist/SteamSpeedScanner.exe
        
    - name: Delete old release if exists
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        gh release delete ${{ github.ref_name }} --yes 2>$null || $true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generateReleaseNotes: true
        artifacts: dist/SteamSpeedScanner.exe
        body: "Steam Speed Scanner v${{ github.ref_name }} — standalone Windows executable. Just download and run."
        token: ${{ secrets.GITHUB_TOKEN }}
